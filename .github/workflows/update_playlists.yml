name: Update FAST Playlists and EPG

on:
  schedule:
    # Runs every 2 hours to keep live HLS stream tokens fresh well before expiration
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'generate_playlists.py'
      - 'custom_channels.json'
      - 'requirements.txt'
      - '.github/workflows/update_playlists.yml'

# Permissions required to push commits back to the repository
permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Playlist Generator
        run: |
          python generate_playlists.py

      - name: Commit and Push Updated Playlists
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add playlists/ custom_channels.json
          if git diff --staged --quiet; then
            echo "No changes detected. Nothing to commit."
          else
            git commit -m "Auto-refresh live streams, FAST playlists, and EPG headers [skip ci]"
            git push
          fi
